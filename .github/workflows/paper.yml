# Builds the draft and the reviewer PDF on every push to main and on every pull request that is
# not a draft (mark it ready to run it), and runs every lint rule as its own step,
# so the run page lists the rules with a check or a cross each, findings appear as annotations
# on the files, and the job summary ends with one table. Gates fail the run; report rules only
# report. The paper repository is created by Overleaf per project, so this file travels with the
# Overleaf project; see "Paper CI" in the guide. The steps below mirror `texlua scripts/lint.lua list`.
name: paper
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
env:
  LINT_PROFILE: tdk   # thesis: the faculty's thesis guide instead of the TDK call; the phase comes from \lintphase in thesis.tex
jobs:
  paper:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Inkscape for SVG figures, poppler for the PDF rules, hunspell for spelling
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends inkscape poppler-utils hunspell hunspell-en-gb hunspell-en-us >/dev/null
      - name: template / the lint's skeleton copy matches content/ (the template's repository only)
        if: github.repository == 'BlackLight54/tdk-paper-template'
        run: for f in content/0[1-7]-*.tex; do cmp "$f" "scripts/lint/skeleton/${f#content/}" || exit 1; done
      - name: template / the guide's essentials page matches scripts/lint/essentials.lua (the template's repository only)
        if: github.repository == 'BlackLight54/tdk-paper-template'
        run: texlua scripts/lint.lua essentials --guide | cmp - guide/essentials.tex
      - name: Build the draft
        run: make all
      - name: Build the reviewer PDF
        run: make reviewer
      - name: Upload the PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            thesis.pdf
            reviewer.pdf
      - name: source / essentials (check)
        if: always()
        run: texlua scripts/lint.lua essentials
      - name: Lint header
        if: always()
        run: printf '\n## Lint (profile %s)\n\n| Group | Status | Check | Rule | Findings |\n|---|---|---|---|---|\n' "$LINT_PROFILE" >> "$GITHUB_STEP_SUMMARY"
      - name: source / outline (check, draft)
        if: always()
        run: texlua scripts/lint.lua outline
      - name: source / numbers (advice, polish)
        if: always()
        run: texlua scripts/lint.lua numbers
      - name: source / frame (check)
        if: always()
        run: texlua scripts/lint.lua frame
      - name: source / roles (check, draft)
        if: always()
        run: texlua scripts/lint.lua roles
      - name: source / chapters (check)
        if: always()
        run: texlua scripts/lint.lua chapters
      - name: source / orphans (advice)
        if: always()
        run: texlua scripts/lint.lua orphans
      - name: source / stubs (check, polish)
        if: always()
        run: texlua scripts/lint.lua stubs
      - name: source / spine (advice)
        if: always()
        run: texlua scripts/lint.lua spine
      - name: source / build (check)
        if: always()
        run: texlua scripts/lint.lua build --doc reviewer
      - name: source / overfull (check)
        if: always()
        run: texlua scripts/lint.lua overfull --doc reviewer
      - name: source / preamble (check)
        if: always()
        run: texlua scripts/lint.lua preamble
      - name: tools / repo-hygiene (check)
        if: always()
        run: texlua scripts/lint.lua repo-hygiene
      - name: source / figures (check)
        if: always()
        run: texlua scripts/lint.lua figures
      - name: source / captions (advice, polish)
        if: always()
        run: texlua scripts/lint.lua captions
      - name: source / axes (advice, polish)
        if: always()
        run: texlua scripts/lint.lua axes
      - name: source / tables (advice, polish)
        if: always()
        run: texlua scripts/lint.lua tables
      - name: source / labels (check)
        if: always()
        run: texlua scripts/lint.lua labels
      - name: source / crefs (check)
        if: always()
        run: texlua scripts/lint.lua crefs
      - name: source / bib (check)
        if: always()
        run: texlua scripts/lint.lua bib
      - name: source / companion (check)
        if: always()
        run: texlua scripts/lint.lua companion
      - name: source / code (check)
        if: always()
        run: texlua scripts/lint.lua code
      - name: tools / checkcites (count)
        if: always()
        run: texlua scripts/lint.lua checkcites --doc reviewer
      - name: tools / bibtex-log (count)
        if: always()
        run: texlua scripts/lint.lua bibtex-log --doc reviewer
      - name: tools / links (advice)
        if: always()
        run: texlua scripts/lint.lua links
      - name: source / acronyms (check, polish)
        if: always()
        run: texlua scripts/lint.lua acronyms
      - name: source / typography (advice, polish)
        if: always()
        run: texlua scripts/lint.lua typography
      - name: source / terms (advice, polish)
        if: always()
        run: texlua scripts/lint.lua terms
      - name: source / language (advice, polish)
        if: always()
        run: texlua scripts/lint.lua language
      - name: tools / chktex (advice)
        if: always()
        run: texlua scripts/lint.lua chktex
      - name: tools / lacheck (advice)
        if: always()
        run: texlua scripts/lint.lua lacheck
      - name: tools / spelling (advice)
        if: always()
        run: texlua scripts/lint.lua spelling
      - name: source / stock (check, draft)
        if: always()
        run: texlua scripts/lint.lua stock
      - name: source / pages (check, final)
        if: always()
        continue-on-error: ${{ github.ref_name != 'main' }}
        run: texlua scripts/lint.lua pages --doc reviewer
      - name: source / aidecl (check, final)
        if: always()
        run: texlua scripts/lint.lua aidecl
      - name: source / titlepage (check, final)
        if: always()
        run: texlua scripts/lint.lua titlepage
      - name: pdf / pdf-file (check, polish)
        if: always()
        run: texlua scripts/lint.lua pdf-file --doc reviewer
      - name: pdf / pdf-font (check, polish)
        if: always()
        run: texlua scripts/lint.lua pdf-font --doc reviewer
      - name: pdf / pdf-spacing (check, polish)
        if: always()
        run: texlua scripts/lint.lua pdf-spacing --doc reviewer
      - name: pdf / pdf-margins (check, polish)
        if: always()
        run: texlua scripts/lint.lua pdf-margins --doc reviewer
      - name: pdf / pdf-smalltext (advice, polish)
        if: always()
        run: texlua scripts/lint.lua pdf-smalltext --doc reviewer
      - name: pdf / pdf-pages (check, final)
        if: always()
        continue-on-error: ${{ github.ref_name != 'main' }}
        run: texlua scripts/lint.lua pdf-pages --doc reviewer
      - name: pdf / pdf-parts (check, final)
        if: always()
        run: texlua scripts/lint.lua pdf-parts --doc reviewer
      - name: source / markers (check, draft)
        if: always()
        run: texlua scripts/lint.lua markers
      - name: source / placeholders (count, final)
        if: always()
        run: texlua scripts/lint.lua placeholders
      - name: source / beats (count, final)
        if: always()
        run: texlua scripts/lint.lua beats
      - name: tools / words (count, polish)
        if: always()
        run: texlua scripts/lint.lua words
      - name: burn-down record
        if: always()
        run: texlua scripts/lint.lua burndown --doc reviewer | tail -1 | tee burndown.json
      - name: Keep the burn-down record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burndown-${{ github.run_number }}
          path: burndown.json
